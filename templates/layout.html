<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Finance Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        // Apply saved theme before the page renders to avoid a flash
        (function() {
            if (localStorage.getItem('theme') === 'dark')
                document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">
                <span class="brand-mark">&#9670;</span>
                <span class="brand-name">Household Finance</span>
            </div>
            <nav>
                <a href="{{ url_for('index') }}" class="{{ 'active' if request.path == url_for('index') else '' }}">
                    Dashboard
                </a>
                <a href="{{ url_for('income_page') }}" class="{{ 'active' if request.path == url_for('income_page') else '' }}">
                    Income
                </a>
                <a href="{{ url_for('expenses_page') }}" class="{{ 'active' if request.path == url_for('expenses_page') else '' }}">
                    Expenses
                </a>
                <a href="{{ url_for('debts_page') }}" class="{{ 'active' if request.path == url_for('debts_page') else '' }}">
                    Debts
                </a>
                <a href="{{ url_for('investments_page') }}" class="{{ 'active' if request.path == url_for('investments_page') else '' }}">
                    Investments
                </a>
                <a href="{{ url_for('snapshot_page') }}" class="{{ 'active' if request.path == url_for('snapshot_page') else '' }}">
                    Snapshot
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
                    <span id="theme-label">Dark mode</span>
                    <span id="theme-icon">🌙</span>
                </button>
            </div>
        </aside>
        <div class="content">
            <main>
                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        <ul class="flashes">
                        {% for m in messages %}
                            <li>{{ m }}</li>
                        {% endfor %}
                        </ul>
                    {% endif %}
                {% endwith %}
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    <script>
        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
            syncToggleUI();
        }

        function syncToggleUI() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const label = document.getElementById('theme-label');
            const icon = document.getElementById('theme-icon');
            if (label) label.textContent = isDark ? 'Light mode' : 'Dark mode';
            if (icon) icon.textContent = isDark ? '☀️' : '🌙';
        }

        // Sync button label/icon on every page load
        syncToggleUI();
    </script>
</body>
</html>
